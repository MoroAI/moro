repos:
  # MoroAI Safety & Alignment Guardian
  - repo: local
    hooks:
      - id: moro-safety-check
        name: MoroAI Safety & Secret Scanner
        entry: python scripts/hooks/pre_commit_safety_check.py
        language: system
        pass_filenames: false
        always_run: true
        description: >
          Scans staged files for hardcoded secrets (API keys, private keys, tokens)
          and PII leaks in dataset files (.jsonl, .csv, .json).

  # Ruff linter + formatter (fast, replaces flake8 + black + isort)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # Type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports, --no-strict-optional]
        files: ^src/moro/

  # Basic file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=5000]
        description: Block commits of large dataset files (>5MB)
      - id: debug-statements
        description: Block Python debug/breakpoint statements
