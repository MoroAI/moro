<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#05070f" />
    </linearGradient>

    <!-- Brand Cyan-Purple Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Accent Emerald Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="ambientLight" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>

    <!-- Dot Pattern -->
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="0.8" fill="#334155" opacity="0.4" />
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Subtle Grid Texture -->
  <rect width="1200" height="380" rx="16" fill="url(#gridPattern)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="80" r="140" fill="#38bdf8" opacity="0.12" filter="url(#ambientLight)" />
  <circle cx="1020" cy="120" r="160" fill="#a855f7" opacity="0.10" filter="url(#ambientLight)" />
  <circle cx="600" cy="340" r="180" fill="#06b6d4" opacity="0.08" filter="url(#ambientLight)" />

  <!-- Top Pill / Status Tag -->
  <g transform="translate(60, 42)">
    <rect width="280" height="30" rx="15" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="16" cy="15" r="4.5" fill="#10b981" />
    <circle cx="16" cy="15" r="8" fill="#10b981" opacity="0.25" />
    <text x="32" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="0.5">LOCAL-FIRST LLM FINE-TUNING</text>
  </g>

  <!-- Main Logo Mark & Title -->
  <g transform="translate(60, 92)">
    <!-- Icon Box -->
    <rect x="0" y="4" width="76" height="76" rx="18" fill="#0b1329" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.5" filter="url(#glow)" />
    <!-- Letter M Vector with Gradient -->
    <path d="M18 60V24L38 42L58 24V60" stroke="url(#brandGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="18" cy="24" r="3.5" fill="#38bdf8" />
    <circle cx="38" cy="42" r="4" fill="#3b82f6" />
    <circle cx="58" cy="24" r="3.5" fill="#a855f7" />

    <!-- Title & Tagline -->
    <text x="96" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="52" fill="#ffffff" letter-spacing="-1">
      Moro<tspan fill="#38bdf8">AI</tspan>
    </text>
    <text x="310" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="20" fill="#64748b">
      / mɔːroʊ /
    </text>

    <!-- Subtitle -->
    <text x="0" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="21" fill="#cbd5e1" letter-spacing="-0.2">
      The Sovereign AI Adaptation Engine.
    </text>
    <text x="0" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="15" fill="#94a3b8">
      Fine-tune open LLMs on your own private data and consumer GPUs — zero cloud APIs, zero leaks, zero OOM crashes.
    </text>
  </g>

  <!-- Right Side Interactive Feature Cards -->
  <g transform="translate(740, 40)">
    <!-- Card 1: Self-Healing -->
    <rect x="0" y="0" width="400" height="84" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <circle cx="34" cy="42" r="16" fill="#38bdf8" fill-opacity="0.15" />
    <path d="M28 42L33 47L41 37" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="64" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" font-size="14" fill="#f8fafc">5-Level OOM Self-Healing</text>
    <text x="64" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="400" font-size="12" fill="#94a3b8">Autonomous VRAM recovery cascade: 0 aborted runs</text>
    <text x="64" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="600" font-size="11" fill="#38bdf8">Checkpointing → Dynamic Truncation → NF4 Fallback</text>

    <!-- Card 2: MI Guard -->
    <rect x="0" y="98" width="400" height="84" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <circle cx="34" cy="140" r="16" fill="#10b981" fill-opacity="0.15" />
    <path d="M34 131V149M27 137L41 143" stroke="#10b981" stroke-width="2.2" stroke-linecap="round" />
    <text x="64" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" font-size="14" fill="#f8fafc">Epistemic MI Guard</text>
    <text x="64" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="400" font-size="12" fill="#94a3b8">Cryptographic PII scrubbing &amp; token entropy sanitization</text>
    <text x="64" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="600" font-size="11" fill="#10b981">Zero data leaks • SOC2 &amp; HIPAA friendly</text>

    <!-- Card 3: 1-Click Deploy -->
    <rect x="0" y="196" width="400" height="84" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <circle cx="34" cy="238" r="16" fill="#a855f7" fill-opacity="0.15" />
    <path d="M26 238L32 232L42 244" stroke="#a855f7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="64" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" font-size="14" fill="#f8fafc">1-Click Local Serving</text>
    <text x="64" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="400" font-size="12" fill="#94a3b8">Instant export to Ollama Modelfile, GGUF, or vLLM</text>
    <text x="64" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="600" font-size="11" fill="#a855f7">moro deploy --target ollama --tag custom-bot:v1</text>
  </g>

  <!-- Bottom Badges Bar -->
  <g transform="translate(60, 316)">
    <!-- Badge 1: Hardware -->
    <rect x="0" y="0" width="150" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#38bdf8">⚡ RTX 3060 - 4090</text>
    
    <!-- Badge 2: Apple Silicon -->
    <rect x="160" y="0" width="150" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="174" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">🍎 Apple M1 - M4</text>

    <!-- Badge 3: Zero Cloud -->
    <rect x="320" y="0" width="150" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="334" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#10b981">🔒 100% Local-First</text>

    <!-- Badge 4: Open Source -->
    <rect x="480" y="0" width="150" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="496" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">📜 Apache-2.0</text>
  </g>
</svg>
