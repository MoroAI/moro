[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moroai"
version = "0.1.0"
description = "MoroAI: local-first model adaptation foundry"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "MoroAI Team" }
]
keywords = [
  "llm",
  "fine-tuning",
  "local-ai",
  "cli",
  "evals",
  "deployment",
]

dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "psutil>=5.9",
  "python-multipart>=0.0.18",
  "fastapi>=0.100.0",
  "uvicorn>=0.20.0",
  "httpx>=0.24.0",
]

[project.optional-dependencies]
# Reference stack exercised by the Linux CPU integration job.
train = [
  "torch==2.14.1",
  "transformers==5.18.0",
  "datasets==5.0.1",
  "peft==0.21.2",
  "trl==1.14.1",
  "accelerate==1.15.0",
  # Dataset transport: patched initial-request, resource-exhaustion and cookie handling.
  "aiohttp==3.14.4",
]
cuda = ["bitsandbytes==0.50.2"]
eval = ["jsonschema>=4"]


analytics = [
  "duckdb>=0.10",
  "pandas>=2.0",
]

dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]

[project.urls]
Repository = "https://github.com/MoroAI/moro"
Issues = "https://github.com/MoroAI/moro/issues"

[project.scripts]
moro = "moro.main:app"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.setuptools.package-data]
"moro.dashboard" = ["templates/*.html", "static/vendor/*"]
