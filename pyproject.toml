[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moroai"
version = "0.1.0"
description = "MoroAI: local-first model adaptation foundry"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "MoroAI Team" }
]
keywords = [
  "llm",
  "fine-tuning",
  "local-ai",
  "cli",
  "evals",
  "deployment",
]

dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "psutil>=5.9",
]

[project.optional-dependencies]
# Reference stack exercised by the Linux CPU integration job.
train = [
  "torch==2.8.0",
  "transformers==4.56.2",
  "datasets==4.1.1",
  "peft==0.17.1",
  "trl==0.23.1",
  "accelerate==1.10.1",
]
cuda = ["bitsandbytes==0.47.0"]


analytics = [
  "duckdb>=0.10",
  "pandas>=2.0",
]

dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]

[project.urls]
Repository = "https://github.com/MoroAI/moro"
Issues = "https://github.com/MoroAI/moro/issues"

[project.scripts]
moro = "moro.main:app"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
