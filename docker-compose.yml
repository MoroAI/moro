x-project-service: &project-service
  build: .
  user: "${MORO_UID:-10001}:${MORO_GID:-10001}"
  volumes:
    - "${MORO_PROJECT_DIR:-.}:/workspace"
  environment:
    OLLAMA_BASE_URL: http://ollama:11434
  labels:
    moro.managed: "true"
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  ollama:
    # Pinned to upstream ollama/ollama:latest as of 2026-10-29 (multi-arch manifest).
    image: ollama/ollama@sha256:b2f0122c476bc9fe7ce679d8bb4bd555351e25e2554eefb156f61cb0a89cf429
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    labels:
      moro.managed: "true"
    restart: unless-stopped
    cpus: "4.0"
    mem_limit: 8g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3

  dashboard:
    <<: *project-service
    command: python -m uvicorn moro.dashboard.mission_control:mission_app --host 0.0.0.0 --port 8501
    ports:
      - "127.0.0.1:8501:8501"
    cpus: "1.0"
    mem_limit: 2g
    depends_on: [ollama]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8501/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  gateway:
    <<: *project-service
    command: python -m uvicorn moro.dashboard.gateway:gateway_app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    cpus: "1.0"
    mem_limit: 1g
    depends_on: [ollama]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  webhook:
    <<: *project-service
    command: python -m uvicorn moro.flywheel.webhook.receiver:webhook_app --host 0.0.0.0 --port 8001
    ports:
      - "127.0.0.1:8001:8001"
    cpus: "1.0"
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  flywheel:
    <<: *project-service
    command: sh -c 'set -e; mkdir -p /workspace/.moro; while true; do python -m moro.main flywheel run; date -u +%FT%TZ > /workspace/.moro/flywheel.heartbeat; sleep 3600; done'
    profiles: [feedback]
    cpus: "2.0"
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,time,sys; p='/workspace/.moro/flywheel.heartbeat'; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p) < 7200 else 1)\""]
      interval: 5m
      timeout: 30s
      retries: 3
      start_period: 10m

volumes:
  ollama_data:
